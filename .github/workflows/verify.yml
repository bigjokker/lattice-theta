name: Verify exact certificates

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distributed file hashes
        run: python scripts/verify_integrity.py
      - name: Run all scientific regression tests
        run: python scripts/run_tests.py --all
      - name: Replay the rank-four counterexample
        run: python code/rank4_counterexample.py --replay data/rank4-counterexample/det23716.json --output scratch/counterexample-replay.json
      - name: Replay the determinant-1729 level-four certificate
        run: python code/verify_rank4_level4.py --bijection data/rank4-level4/cs-bijection.json --certificates data/rank4-level4/det1729-level4.json --output scratch/level4-det1729-replay.json
      - name: Replay the determinant-280 level-four certificate
        run: python code/verify_rank4_det280.py --output scratch/level4-det280-replay.json
      - name: Replay the determinant-280 census chunks and check the closure summary
        run: |
          python code/rank4_gap_census.py replay --regions odd-div4-280 even-div4-280 --workers 2 --out scratch/rank4-gap-census
          python code/rank4_gap_census.py summary --out scratch/rank4-gap-census
      - name: Check the stage-two constructions and the odd-determinant zero planes
        run: |
          python code/rank4_stage2_checks.py --output scratch/rank4-stage2/strategy-checks.json
          python code/rank4_plus_type_census.py planes --out scratch/rank4-plus-type
          python code/rank4_plus_type_census.py replay --workers 2 --out scratch/rank4-plus-type
      - name: Replay the determinant-1156 counterexample
        run: python code/verify_rank4_eisenstein.py --certificates data/rank4-eisenstein/det1156-level2.json --output scratch/eisenstein-det1156-replay.json
      - name: Replay the determinant-121 parity certificates
        run: python code/verify_rank4_parity.py certificates data/rank4-parity/c1-counterexamples.json --output scratch/parity-certificates-replay.json
      - name: Check the two small isospectral pairs
        run: python code/check_small_pairs.py
